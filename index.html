<style>
body{font-family:'Traditional Arabic',serif;background:#f4f6f9;padding:20px}
header{text-align:center;position:relative}
h1{color:#1f3c88;border-bottom:3px solid #1f3c88;display:inline-block;padding:8px 25px;background:#fff;border-radius:10px}
#menuBtn{position:absolute;left:20px;top:10px;font-size:2rem;cursor:pointer}
#menuOptions{display:none;position:absolute;left:20px;top:50px;background:#fff;border:1px solid #ccc;border-radius:8px}
#menuOptions div{padding:10px;cursor:pointer}
#menuOptions div:hover{background:#1f3c88;color:#fff}
.container{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:15px}
.student-block{border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px}
.top-row{display:flex;gap:10px}
.number{width:25px}
.name{font-weight:bold;color:#1f3c88;font-size:1.4rem}
.course{font-size:0.9rem;color:#555}
.bottom-row{margin-top:8px;display:flex;gap:10px}
.bottom-row input{width:70px;text-align:center}
.submit-btn{text-align:center;margin-top:30px}
.submit-btn button{margin:5px;padding:10px 20px;background:#1f3c88;color:#fff;border:none;border-radius:6px}
</style>
</head>

<div class="container" id="formContainer"></div>

<div class="submit-btn">

const container=document.getElementById("formContainer");
const halqaTitle=document.getElementById("halqaTitle");
const menuBtn=document.getElementById("menuBtn");
const menuOptions=document.getElementById("menuOptions");

function loadHalqa(key){
container.innerHTML="";
halqaTitle.textContent=key==="bukhari"?"حلقة الإمام البخاري":key==="muslim"?"حلقة الإمام مسلم":"حلقة الإمام أبو داود";
(halqat[key]||[]).forEach((s,i)=>{
const div=document.createElement("div");
div.className="student-block";
div.innerHTML=`
<div class="top-row">
<div class="number">${i+1}</div>
<div>
<div class="name">${s[0]}</div>
<div class="course">${s[1]}</div>
</div>
</div>
<div class="bottom-row">
<input placeholder="صفحة">
<input placeholder="حديث">
<input placeholder="درجة">
</div>`;
container.appendChild(div);
});
}

menuBtn.onclick=()=>menuOptions.style.display=menuOptions.style.display==="block"?"none":"block";
menuOptions.querySelectorAll("div").forEach(d=>d.onclick=()=>{loadHalqa(d.dataset.halqa);menuOptions.style.display="none";});

loadHalqa("bukhari");
