<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تحضير الطلاب - صباحي ومسائي</title>

  <!-- مكتبة Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Traditional Arabic', serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 10px;
    }
    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .student {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1f3c88;
    }
    .buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .buttons button {
      padding: 7px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .present { background: #4caf50; color: white; }
    .absent { background: #e53935; color: white; }

    .export-buttons {
      text-align: center;
      margin-top: 20px;
    }
    .export-buttons button {
      padding: 10px 20px;
      font-size: 1.05rem;
      border: none;
      background: #1f3c88;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    .export-buttons .clear-btn {
      background: #e53935;
    }

    .section-title {
      text-align: center;
      font-size: 1.4rem;
      color: #16316e;
      margin-top: 20px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #halqaButtons {
      text-align: center;
      margin-bottom: 15px;
    }
    #halqaButtons button {
      padding: 8px 16px;
      margin: 4px;
      background: #16316e;
      color: white;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #halqaButtons button.active {
      background: #1f3c88;
    }

    @media (max-width: 600px) {
      .student {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<h1>تحضير الطلاب</h1>

<div id="halqaButtons">
  <button onclick="changeHalqa('bukhari')" id="btn-bukhari">البخاري</button>
  <button onclick="changeHalqa('muslim')" id="btn-muslim">مسلم</button>
  <button onclick="changeHalqa('tirmidhi')" id="btn-tirmidhi">الترمذي</button>
</div>

<div class="container">
  <div class="section-title">🟦 التحضير الصباحي</div>
  <div id="morning"></div>

  <div class="section-title">🟧 التحضير المسائي</div>
  <div id="evening"></div>

  <div class="export-buttons">
    <button onclick="exportWhatsApp()">إرسال عبر واتساب</button>
    <button onclick="exportExcel()">تصدير Excel</button>
    <button class="clear-btn" onclick="clearAttendance()">تصفير التحضير</button>
  </div>
</div>

<script>
  // أسماء الحلقات بالعربي (للتقارير)
  const halqaTitles = {
    bukhari: "حلقة الإمام البخاري",
    muslim: "حلقة الإمام مسلم",
    tirmidhi: "حلقة الإمام الترمذي"
  };

  // ثلاث حلقات منفصلة
  const halqat = {
    bukhari: [
      "محمد علي محمد حمزة","محمد عبد الرحمن أيده","أحمد محمد عبد الرحمن أيده",
      "عبدالرحمن محمد عبدالمتين عثماني","فردوس أبدونا سادات","عثمان إبراهيم عثمان",
      "أنس ساري","محمد موسى محمد","إبراهيم بن عبدالعزيز الصوينع","ابراهيم عبدو إدريس",
      "مراد محمد الطراونة","محمد نورو زامباليغرى","سعد إبراهيم القرشي",
      "عبد الرحمن بن حسين القحطاني","عبد الرحمن مبارك محمد القحطاني",
      "محمد حمزة الزبيدي","معاذ العبدالسلام","فارس تركي الرشيد",
      "المنذر عامر الشمراني","عبدالرحمن محمد باوزير","محمد عبدو إدريس",
      "محمد حمزة حسين جحاف","معتز محمد النعمي","محمد علاء ربيع",
      "زبير محكم بيك سفروف","جار الله الجار الله"
    ],
    muslim: [
      "عبدالله أيوب علي","محمد علي أبو بكر","احمد محمد حسين",
      "أحمد يحيى عبدالحميد صقر","ابراهيم يسلم الصيعري","وليد حسن العامري",
      "آدم موسى يوسف","محمد حسن السيد دياب","عبدالكريم علي عايض ال فردان",
      "أحمد عبد الستار محمد محمد","سلمان محمد الشيحة",
      "عبدالله بن مسفر بن سفر الغبيوي","فهد بن محمد العجمي",
      "ألفا محمد بيلو بري","عقيل خالد العقيل","محمد بن علي الخضيري",
      "ناصر بن محمد الموسى","أحمد علي بن عفيف","عماد أبو بكر محمد آدم",
      "مصعب علاء بركات","عبد الرحمن أيمن الزعبي","عبد العزيز محمد إسحاق",
      "محمد فضلان","عبدالفتاح","عبدالرحيم طارش الكركز","نجيب محمد أحمد هزاع"
    ],
    tirmidhi: [
      "صهيب الحمد","منير حمزة الهوساوي","عبدالمالك ياسمين امين","عبدالصمد ياسمين امين",
      "خالد عرفات يحيى عيسى","أبوبكر ثالث سراج","عبد الحكيم إدريس أولاديميجي",
      "علي غوث عبد الله كونتي","يوسف عبدالرحمن علي",
      "عبدالرحمن بن عبدالله بن إسماعيل الشرعبي","محمد عبدالله منصور الغريب",
      "سمير جمال حسن الشامي","موسى زكريا عيسى","ياسر بن عبدالعزيز الدويش",
      "أنس بن عبدالرحمن الشدي","عبداللطيف بن حسن السعيد","شداد عمر أمين",
      "احمد بن إبراهيم الهاشمي","اويس حمد البابطين","عمر حمزة الأنصاري",
      "فهد احمد الخالدي","عبد الله عمار الجرادي","محمد جهاد حماد",
      "إبراهيم حمزة عيدروس","كامل رمضان","مرتضى أديبايو",
      "عبدالله ياسر أحمد المحمودي"
    ]
  };

  let currentHalqa = "bukhari";

  function setActiveButton() {
    ["bukhari","muslim","tirmidhi"].forEach(key => {
      const btn = document.getElementById("btn-" + key);
      if (!btn) return;
      if (key === currentHalqa) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  function renderHalqa() {
    document.getElementById("morning").innerHTML = "";
    document.getElementById("evening").innerHTML = "";
    loadAttendance("morning");
    loadAttendance("evening");
    setActiveButton();
  }

  function loadAttendance(type) {
    const savedKey = currentHalqa + "_" + type;
    const saved = JSON.parse(localStorage.getItem(savedKey) || "{}");
    const container = document.getElementById(type);
    const students = halqat[currentHalqa];

    students.forEach(name => {
      const div = document.createElement("div");
      div.className = "student";

      const status = saved[name] || "";

      div.innerHTML = `
        <div class="name">${name}</div>
        <div class="buttons">
          <button class="present" onclick="mark('${type}','${name}','حضور', this)">حضور</button>
          <button class="absent" onclick="mark('${type}','${name}','غياب', this)">غياب</button>
          <span style="margin-right:10px; color:#555; font-size:0.95rem;">${status}</span>
        </div>
      `;

      container.appendChild(div);
    });
  }

  function mark(type, name, value, btn) {
    const key = currentHalqa + "_" + type;
    let saved = JSON.parse(localStorage.getItem(key) || "{}");
    saved[name] = value;
    localStorage.setItem(key, JSON.stringify(saved));
    btn.parentElement.querySelector("span").textContent = value;
  }

  function changeHalqa(key) {
    currentHalqa = key;
    renderHalqa();
  }

  // تصدير واتساب
  function exportWhatsApp() {
    const students = halqat[currentHalqa];
    const morning = JSON.parse(localStorage.getItem(currentHalqa + "_morning") || "{}");
    const evening = JSON.parse(localStorage.getItem(currentHalqa + "_evening") || "{}");

    let text = `${halqaTitles[currentHalqa]}:\n\n`;

    students.forEach(name => {
      const m = morning[name] || "—";
      const e = evening[name] || "—";
      text += `${name}\nصباحي: ${m}\nمسائي: ${e}\n\n`;
    });

    const url = "https://wa.me/?text=" + encodeURIComponent(text);
    window.open(url, "_blank");
  }

  // تصدير Excel
  function exportExcel() {
    const students = halqat[currentHalqa];
    const morning = JSON.parse(localStorage.getItem(currentHalqa + "_morning") || "{}");
    const evening = JSON.parse(localStorage.getItem(currentHalqa + "_evening") || "{}");

    const wb = XLSX.utils.book_new();
    const wsData = [
      ["اسم الطالب", "التحضير الصباحي", "التحضير المسائي"],
      ...students.map(name => [
        name,
        morning[name] || "",
        evening[name] || ""
      ])
    ];

    const ws = XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, "تحضير");
    XLSX.writeFile(wb, `تحضير_${currentHalqa}.xlsx`);
  }

  // تصفير التحضير للحلقة الحالية
  function clearAttendance() {
    localStorage.removeItem(currentHalqa + "_morning");
    localStorage.removeItem(currentHalqa + "_evening");
    renderHalqa();
    alert("تم تصفير التحضير لهذه الحلقة");
  }

  // تحميل أول حلقة عند فتح الصفحة
  renderHalqa();
</script>

</body>
</html>
